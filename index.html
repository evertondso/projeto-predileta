<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predileta - Controle de Entregas</title>
</head>
<body>
    <header>
    <h1>Predileta Água</h1>
    <p>Controle Rápido de Entregas</p>
  </header>


  <main>
    <section id="tela-login">
      <h2>Acesso Operacional</h2>
      <label for="operador">Nome do Entregador:</label>
      <input type="text" id="operador" placeholder="Ex: Everson">
      <button type="button">Entrar no Sistema</button>
    </section>
  </main> 
  <!-- Tela 2: Registro de Entrega e Histórico -->
    <section id="tela-app">
      <div class="card">
        <h2>Nova Entrega</h2>
        <p id="saudacao"></p>
        
        <label for="cliente">Cliente / Endereço:</label>
        <input type="text" id="cliente" placeholder="Ex: Rua das Flores, 120">

        <label for="entregues">Galões Entregues (Cheios):</label>
        <input type="number" id="entregues" value="1" min="0">

        <label for="devolvidos">Cascos Recolhidos (Vazios):</label>
        <input type="number" id="devolvidos" value="1" min="0">

        <button type="button" onclick="registrarEntrega()">Confirmar Entrega</button>
        <p id="alerta-feedback" role="alert" aria-live="polite"></p>
      </div>

      <div class="card">
        <h2>Entregas de Hoje</h2>
        <ul id="lista-entregas"></ul>
      </div>
    </section>
    </main>

    <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predileta - Controle de Entregas</title>
  <link rel="stylesheet" href="style.css"> <!-- Adiciona essa linha se não tiver -->
</head>
<!-- Link para o arquivo de lógica JavaScript -->
  <script src="app.js"></script>
</body>
</html>

  <script src="app.js"></script>
</body>
</html>
